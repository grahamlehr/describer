# Installed by deploy/install.sh as
# /etc/systemd/system/getty@tty1.service.d/10-describer-kiosk.conf.
#
# While the kiosk is enabled, tty1 belongs to it: starting getty@tty1 then
# succeeds and does nothing. It must succeed. Raspberry Pi OS's first-boot user
# setup (cancel-rename) ends with `systemctl enable getty@tty1` and `systemctl
# start getty@tty1`; masking the unit made both fail, the user setup failed
# with them, and the Pi asked for a username for ever. See docs/traps.md.
#
# `systemctl disable kiosk.service` and a reboot give tty1 its login back.
[Unit]
ConditionPathExists=!/etc/systemd/system/multi-user.target.wants/kiosk.service
